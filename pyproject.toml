[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "df-local-foundation"
version = "1.1.0"
description = "Shared local PostgreSQL control surface for Forge ecosystem applications"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "jsonschema>=4.21.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
# Read-only HTTP health API (app/). Optional: the core library and CLI tools do not require it.
api = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
